[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockally-django"
version = "0.1.0"
description = "Official Lockally email backend for Django — send transactional email via Lockally."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Lockally", email = "support@lockally.com" }]
keywords = ["lockally", "django", "email", "email-backend", "transactional"]
dependencies = [
    "lockally>=0.1,<1",
    "django>=4.2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://lockally.com"
Repository = "https://github.com/lockallyinc/lockally-django"

[tool.setuptools]
packages = ["lockally_django"]
