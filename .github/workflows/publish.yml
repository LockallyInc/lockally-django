# Release workflow for the Python SDK (PyPI project `lockally`).
#
# TEMPLATE — inert in this monorepo. Copy to `.github/workflows/publish.yml`
# in the SDK's own repo (the generated `sdk/python/` tree, pushed to
# github.com/lockallyinc/lockally-python). Publishing is tag-driven: push `vX.Y.Z`.
#
# One-time setup — NO token required (OIDC Trusted Publishing):
#   - On PyPI, add a Trusted Publisher for project `lockally`: owner `lockallyinc`,
#     repo `lockally-python`, workflow `publish.yml`, environment `pypi`.
#   - Create a GitHub Environment named `pypi` in that repo.
#   The `id-token: write` permission mints the short-lived OIDC token PyPI trusts.
name: Publish PyPI

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # OIDC trusted publishing (no API token)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
